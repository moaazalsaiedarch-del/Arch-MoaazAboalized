<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arch-Ziad Aboelyazid | حصر التشطيبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#dde2ea;--ac:#e06a10;--ac2:#b8540a;--ok:#2e7d4f;--dn:#c0392b;--hd:#14213d;--hdt:#fff;--in:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--card:#18223a;--tx:#e8e6e1;--mu:#9aa0ab;--bd:#2c3a57;--ac:#ff9a4d;--ac2:#ffb27a;--ok:#5cc08a;--dn:#ef7b6f;--hd:#0c1426;--in:#0c1426}}
:root[data-theme="dark"]{--bg:#0f1729;--card:#18223a;--tx:#e8e6e1;--mu:#9aa0ab;--bd:#2c3a57;--ac:#ff9a4d;--ac2:#ffb27a;--ok:#5cc08a;--dn:#ef7b6f;--hd:#0c1426;--in:#0c1426}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;font-size:15px}
header{background:var(--hd);color:var(--hdt);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:19px;letter-spacing:.3px}
h1 small{display:block;font-size:12px;font-weight:400;opacity:.75;direction:ltr;text-align:right}
main{max-width:1150px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.wide{grid-column:span 2}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button:hover{background:var(--ac2)}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sec:hover{background:var(--bg)}
button.ok{background:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.prev{margin-inline-start:auto;font-weight:700;color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;color:var(--ac)}
.stat span{font-size:12px;color:var(--mu)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1020px}
th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--bg);font-size:12px;color:var(--mu);position:sticky;top:0}
td.n{font-variant-numeric:tabular-nums}
tr.ded td{color:var(--dn)}
td button{padding:4px 9px;font-size:12px;margin-inline-end:4px}
.del{background:var(--dn)}
.empty{text-align:center;color:var(--mu);padding:26px}
.tag{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 7px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;padding-top:20px}
.chk input{width:auto}
#msg{font-size:13px;color:var(--ok)}
.ddr{display:grid;grid-template-columns:1.2fr repeat(4,1fr) auto auto;gap:6px;align-items:center;margin-bottom:6px}
.ddv{font-size:12px;color:var(--dn);white-space:nowrap}
.ddr .del{padding:6px 10px}
@media (max-width:640px){.ddr{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>حصر بنود التشطيبات<small>Arch-Ziad Aboelyazid</small></h1>
  <div style="min-width:220px;flex:1;max-width:340px"><input id="pname" placeholder="اسم المشروع" aria-label="اسم المشروع"></div><img id="logoPrev" hidden alt="الشعار" style="height:36px;border-radius:4px;background:#fff"><button id="logoBtn" class="sec" style="color:#fff;border-color:#ffffff66">رفع شعاري</button><button id="logoDel" class="sec" hidden style="color:#fff;border-color:#ffffff66">حذف الشعار</button><input type="file" id="logoFile" accept="image/*" hidden>
</header>
<main>
<section class="card">
  <h2 id="ftitle">إضافة بند حصر</h2>
  <div class="grid">
    <div><label>الدور</label><input id="floor" list="floors" placeholder="مثال: الدور الأول"></div>
    <div><label>القسم / الغرفة</label><input id="section" list="sections" placeholder="مثال: غرفة النوم"></div>
    <div class="wide"><label>البند</label><input id="item" list="items" placeholder="مثال: سيراميك أرضيات"></div>
    <div><label>الوحدة</label>
      <select id="unit"><option>م²</option><option>م.ط</option><option>م³</option><option>عدد</option></select></div>
    <div><label>الطول (م)</label><input id="l" type="number" step="any" min="0" inputmode="decimal"></div>
    <div><label>العرض (م)</label><input id="w" type="number" step="any" min="0" inputmode="decimal"></div>
    <div><label>الارتفاع (م)</label><input id="h" type="number" step="any" min="0" inputmode="decimal"></div>
    <div><label>المساحة (م²)</label><input id="a" type="number" step="any" min="0" inputmode="decimal" placeholder="تلقائية أو اكتبها"></div>
    <div><label>العدد</label><input id="n" type="number" step="any" min="0" value="1" inputmode="decimal"></div>
    <div><label>سعر الوحدة</label><input id="price" type="number" step="any" min="0" inputmode="decimal"></div>
    <label class="chk"><input id="ded" type="checkbox"> اعتبار البند كله خصمًا</label>
  </div>
  <div id="ddbox" style="margin-top:12px">
    <label>خصومات من هذا البند (شبابيك / أبواب / فتحات) تُخصم تلقائيًا من المساحة</label>
    <div id="ddrows"></div>
    <div class="bar" style="margin-top:6px"><button type="button" class="sec" data-add="شباك">+ شباك</button><button type="button" class="sec" data-add="باب">+ باب</button><button type="button" class="sec" data-add="فتحة">+ فتحة أخرى</button><span id="ddsum" style="color:var(--dn);font-weight:700"></span></div>
  </div>
  <div class="bar">
    <button id="save">إضافة البند</button>
    <button id="cancel" class="sec" hidden>إلغاء التعديل</button>
    <span class="prev" id="prev">الكمية: 0</span>
  </div>
  <datalist id="floors"></datalist><datalist id="sections"></datalist><datalist id="items"></datalist>
</section>

<section class="card">
  <div class="stats" id="stats"></div>
</section>

<section class="card">
  <div class="bar" style="margin:0 0 10px">
    <h2 style="margin:0">بنود الحصر</h2>
    <select id="ffilter" style="width:auto;min-width:150px" aria-label="تصفية حسب الدور"></select>
    <span style="margin-inline-start:auto"></span>
    <button id="xl" class="ok">تصدير Excel</button>
    <button id="pdf" class="ok">تصدير PDF</button>
    <button id="jpg" class="ok">تصدير JPG</button>
    <button id="clear" class="sec">مسح الكل</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="scroll"><table>
    <thead><tr><th>م</th><th>الدور</th><th>القسم</th><th>البند</th><th>الوحدة</th><th>الطول</th><th>العرض</th><th>الارتفاع</th><th>المساحة</th><th>العدد</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</section>
<p style="text-align:center;color:var(--mu);font-size:12px">تُحفظ البيانات تلقائيًا في متصفحك على هذا الجهاز فقط.</p>
</main>
<script>
const KEY='arch-ziad-takeoff-v1';
const $=id=>document.getElementById(id);
const FLOORS=['بدروم','الدور الأرضي','الدور الأول','الدور الثاني','الدور الثالث','الدور الرابع','السطح'];
const SECTIONS=['غرفة نوم','صالة','ريسبشن','مطبخ','حمام','سلم','بلكونة','مدخل','طرقة'];
const PRESETS={'سيراميك أرضيات':'م²','بورسلين أرضيات':'م²','رخام أرضيات':'م²','سيراميك حوائط':'م²','بياض محارة':'م²','دهان بلاستيك':'م²','دهان زيتي':'م²','معجون':'م²','أسقف جبس بورد':'م²','بانوهات':'م²','وزر سيراميك':'م.ط','وزر خشب':'م.ط','كرانيش':'م.ط','حلوق أبواب':'عدد','أبواب':'عدد','شبابيك':'عدد','نقاط كهرباء':'عدد','عزل مائي':'م²'};
Object.assign(PRESETS,{'سيراميك أرضيات حمامات':'م²','سيراميك أرضيات مطبخ':'م²','جرانيت أرضيات':'م²','باركيه خشب':'م²','أرضيات فينيل':'م²','موزايكو':'م²','إنترلوك':'م²','أرضيات إيبوكسي':'م²','مونة تسوية أرضيات':'م²','فرش رمل وخرسانة أرضيات':'م²','رخام حوائط':'م²','جرانيت حوائط':'م²','سيراميك حوائط حمامات':'م²','سيراميك حوائط مطبخ':'م²','حجر هاشمي':'م²','حجر ديكوري':'م²','كلادينج واجهات':'م²','ورق حائط':'م²','بانوهات خشب':'م²','بانوهات WPC':'م²','بياض محارة خارجي':'م²','بياض محارة أسقف':'م²','طرطشة':'م²','استوكو':'م²','بغدادلي':'م²','معجون حوائط':'م²','معجون أسقف':'م²','وجه تأسيس (سيلر)':'م²','دهان بلاستيك داخلي':'م²','دهان بلاستيك أسقف':'م²','دهان خارجي':'م²','دهان إيبوكسي':'م²','دهان أبواب وشبابيك':'م²','دهان حديد':'م²','أسقف جبس بورد معلقة':'م²','أسقف جبس بورد مقاوم للرطوبة':'م²','أسقف ألواح معدنية':'م²','أسقف خشب':'م²','كرانيش جبس':'م.ط','ستارة إضاءة (ليد جبس)':'م.ط','وزر بورسلين':'م.ط','وزر رخام':'م.ط','وزر جرانيت':'م.ط','عتبات رخام':'م.ط','عتبات شبابيك رخام':'م.ط','نعل سلم رخام':'م.ط','درجات سلم رخام':'م²','تجليد سلم (قائمة)':'م²','تجليد سلم (نائمة)':'م²','حليات ألومنيوم فواصل':'م.ط','فواصل تمدد':'م.ط','أبواب خشب داخلية':'عدد','أبواب ألوميتال':'عدد','أبواب حديد':'عدد','باب مدخل رئيسي':'عدد','باب شقة مصفح':'عدد','حلق باب خشب':'عدد','كسوة حلوق':'م.ط','شبابيك ألوميتال':'م²','شبابيك خشب':'م²','شبابيك PVC':'م²','زجاج سيكوريت':'م²','واجهات زجاج':'م²','شيش حصيرة':'م²','ستائر رول':'م²','درابزين سلم':'م.ط','درابزين بلكونة':'م.ط','درابزين ستانلس':'م.ط','سور حديد':'م.ط','بوابات حديد':'عدد','عزل حراري أسطح':'م²','عزل حراري حوائط':'م²','عزل حمامات':'م²','عزل خزانات':'م²','عزل بلكونات':'م²','عزل أساسات (بيوتومين)':'م²','طبقة ميول أسطح':'م²','بلاط أسطح':'م²','أطقم حمام':'عدد','أحواض غسيل':'عدد','مراحيض':'عدد','بانيو':'عدد','خلاطات':'عدد','دش':'عدد','مرايا حمام':'عدد','رخامة مطبخ':'م.ط','مطبخ خشب (وحدات سفلية)':'م.ط','مطبخ خشب (وحدات علوية)':'م.ط','دواليب حوائط':'م²','غرفة ملابس':'م²','نقاط إنارة':'عدد','أفياش':'عدد','مفاتيح':'عدد','سبوت لايت':'عدد','نقاط سباكة':'عدد','نقاط تكييف':'عدد','واجهات حجر':'م²','بروزات وكرانيش واجهات':'م.ط'});
let S={name:'',items:[]};
let editId=null,aMan=false,dd=[];
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.items))S=d}}catch(e){}}
function persist(){try{const {logo,logoR,...rest}=S;localStorage.setItem(KEY,JSON.stringify(rest))}catch(e){}}
const num=v=>{const x=parseFloat(v);return isFinite(x)&&x>0?x:0};
function calc(it){
  const l=num(it.l),w=num(it.w),h=num(it.h),n=it.n===''||it.n==null?1:(parseFloat(it.n)||0);
  let b=0;
  const A=it.am?num(it.a):0;
  if(it.unit==='م²')b=(A||l*(w||h))-dedOf(it);
  else if(it.unit==='م.ط')b=l||w||h;
  else if(it.unit==='م³')b=A?A*h:l*w*h;
  else b=1;
  const q=b*n;return it.ded?-q:q;
}
function ddArea(x){const c=x.c===''||x.c==null?1:(parseFloat(x.c)||0);return (num(x.a)||num(x.l)*num(x.w))*c}
function dedOf(it){return (it.dd||[]).reduce((t,x)=>t+ddArea(x),0)}
function renderDD(){
  $('ddrows').innerHTML=dd.map((x,i)=>`<div class="ddr" data-i="${i}"><input data-f="n" placeholder="الاسم" value="${esc(x.n)}"><input data-f="l" type="number" step="any" min="0" placeholder="الطول" value="${esc(x.l)}"><input data-f="w" type="number" step="any" min="0" placeholder="العرض" value="${esc(x.w)}"><input data-f="a" type="number" step="any" min="0" placeholder="أو المساحة" value="${esc(x.a)}"><input data-f="c" type="number" step="any" min="0" placeholder="العدد" value="${esc(x.c)}"><span class="ddv">${f2(ddArea(x))} م²</span><button type="button" class="del" data-x="${i}" aria-label="حذف الخصم">×</button></div>`).join('');
  updDD()}
function updDD(){const t=dd.reduce((s,x)=>s+ddArea(x),0);$('ddsum').textContent=t?'إجمالي الخصم: '+f2(t)+' م²':''}
function areaOf(it){const l=num(it.l),w=num(it.w),h=num(it.h),A=it.am?num(it.a):0;if(it.unit==='م²')return A||l*(w||h);if(it.unit==='م³')return A||l*w;return 0}
const f2=x=>(Math.round(x*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function form(){return{floor:$('floor').value.trim(),section:$('section').value.trim(),name:$('item').value.trim(),unit:$('unit').value,l:$('l').value,w:$('w').value,h:$('h').value,n:$('n').value,price:$('price').value,ded:$('ded').checked,dd:dd.filter(x=>ddArea(x)>0).map(x=>({...x})),a:$('a').value,am:aMan&&$('a').value!==''}}
function preview(){const u=$('unit').value,off=u==='م.ط'||u==='عدد';$('a').disabled=off;$('ddbox').hidden=u!=='م²';
  if(!aMan){const ar=areaOf({...form(),am:false});$('a').value=ar&&!off?Math.round(ar*1000)/1000:''}
  const q=calc(form());$('prev').textContent='الكمية: '+f2(q)+' '+u}
function resetForm(keep){
  editId=null;$('ftitle').textContent='إضافة بند حصر';$('save').textContent='إضافة البند';$('cancel').hidden=true;
  ['item','l','w','h','a','price'].forEach(i=>$(i).value='');aMan=false;dd=[];renderDD();$('n').value='1';$('ded').checked=false;
  if(!keep){$('floor').value='';$('section').value=''}
  preview();
}
function lists(){
  const fl=[...new Set([...FLOORS,...S.items.map(i=>i.floor)].filter(Boolean))];
  const se=[...new Set([...SECTIONS,...S.items.map(i=>i.section)].filter(Boolean))];
  const it=[...new Set([...Object.keys(PRESETS),...S.items.map(i=>i.name)].filter(Boolean))];
  $('floors').innerHTML=fl.map(x=>`<option value="${esc(x)}">`).join('');
  $('sections').innerHTML=se.map(x=>`<option value="${esc(x)}">`).join('');
  $('items').innerHTML=it.map(x=>`<option value="${esc(x)}">`).join('');
  const cur=$('ffilter').value||'';
  const used=[...new Set(S.items.map(i=>i.floor||'—'))];
  $('ffilter').innerHTML='<option value="">كل الأدوار</option>'+used.map(x=>`<option value="${esc(x)}"${x===cur?' selected':''}>${esc(x)}</option>`).join('');
}
function render(){
  lists();
  const fl=$('ffilter').value;
  const list=S.items.map((it,i)=>({it,i})).filter(o=>!fl||(o.it.floor||'—')===fl);
  const rows=$('rows');
  if(!list.length){rows.innerHTML='<tr><td colspan="14" class="empty">لا توجد بنود بعد. أضف أول بند من النموذج بالأعلى.</td></tr>'}
  else rows.innerHTML=list.map(({it,i})=>{const q=calc(it),p=parseFloat(it.price)||0;
    return `<tr class="${it.ded?'ded':''}"><td>${i+1}</td><td>${esc(it.floor)}</td><td>${esc(it.section)}</td><td>${esc(it.name)}${it.ded?' <span class="tag">خصم</span>':''}${dedOf(it)?` <span class="tag">−${f2(dedOf(it))} م²</span>`:''}</td><td>${esc(it.unit)}</td><td class="n">${it.l?esc(it.l)+' م':''}</td><td class="n">${it.w?esc(it.w)+' م':''}</td><td class="n">${it.h?esc(it.h)+' م':''}</td><td class="n">${areaOf(it)?f2(areaOf(it))+' م²':''}</td><td class="n">${esc(it.n)}</td><td class="n"><b>${f2(q)} ${esc(it.unit)}</b></td><td class="n">${p?f2(p)+' جنيه':''}</td><td class="n"><b>${f2(q*p)} جنيه</b></td><td><button class="sec" data-e="${it.id}">تعديل</button><button class="del" data-d="${it.id}">حذف</button></td></tr>`}).join('');
  const all=S.items,tot=all.reduce((s,it)=>s+calc(it)*(parseFloat(it.price)||0),0);
  const fls=new Set(all.map(i=>i.floor||'—')).size;
  $('stats').innerHTML=`<div class="stat"><b>${all.length}</b><span>عدد البنود</span></div><div class="stat"><b>${fls}</b><span>عدد الأدوار</span></div><div class="stat"><b>${new Set(all.map(i=>i.name)).size}</b><span>أنواع البنود</span></div><div class="stat"><b>${f2(tot)} جنيه</b><span>الإجمالي الكلي</span></div>`;
  $('pname').value=S.name||'';updLogo();
}
$('item').addEventListener('change',()=>{const u=PRESETS[$('item').value.trim()];if(u){$('unit').value=u;preview()}});
['floor','section','item','unit','l','w','h','n','ded'].forEach(i=>$(i).addEventListener('input',preview));
$('a').addEventListener('input',()=>{aMan=$('a').value!=='';preview()});
$('ddbox').addEventListener('input',e=>{const r=e.target.closest('.ddr');if(!r||!e.target.dataset.f)return;const x=dd[+r.dataset.i];x[e.target.dataset.f]=e.target.value;r.querySelector('.ddv').textContent=f2(ddArea(x))+' م²';updDD();preview()});
$('ddbox').addEventListener('click',e=>{const t=e.target;if(t.dataset.x!==undefined){dd.splice(+t.dataset.x,1);renderDD();preview()}if(t.dataset.add!==undefined){dd.push({n:t.dataset.add,l:'',w:'',a:'',c:'1'});renderDD();preview()}});
$('save').onclick=()=>{
  const d=form();
  if(!d.name){$('item').focus();return}
  if(editId){const ix=S.items.findIndex(x=>x.id===editId);if(ix>-1)S.items[ix]={...d,id:editId}}
  else S.items.push({...d,id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)});
  persist();resetForm(true);render();$('item').focus();
};
$('cancel').onclick=()=>{resetForm(true)};
$('rows').addEventListener('click',e=>{
  const ed=e.target.dataset.e,dl=e.target.dataset.d;
  if(ed){const it=S.items.find(x=>x.id===ed);if(!it)return;editId=ed;

        v.forEach((x,i)=>{const c=ws.getCell(r,i+1);c.value=x;paint(c,it.ded?'FFFDECEA':WH,it.ded?'FFC0392B':null,false,i===1?'right':'center');if(i>=3&&i<=5)c.numFmt='0.00" م"';else if(i===6)c.numFmt='#,##0.00" م²"';else if(i===8)c.numFmt='#,##0.00" '+it.unit+'"';else if(i>=9)c.numFmt=MN});

    const fv=ws.getCell(r,11);fv.value={formula:subs.join('+'),result:ft};paint(fv,LIGHT,'FFB8540A',true);fv.numFmt=MN;

  const gv=ws.getCell(r,11);gv.value={formula:floorRefs.join('+'),result:grand};paint(gv,NAVY,WH,true);gv.font=gc.font;gv.numFmt=MN;ws.getRow(r).height=28;

  const gf={};S.items.forEach(it=>{const k=it.floor||'بدون دور';gf[k]=(gf[k]||0)+calc(it)*(parseFloat(it.price)||0)});
  let r3=7;Object.entries(gf).forEach(([k,v])=>{[k,v].forEach((x,i)=>{const c=w3.getCell(r3,i+1);c.value=x;paint(c,WH,null,false,i?'center':'right');if(i)c.numFmt=MN});r3++});
  paint(w3.getCell(r3,1),NAVY,WH,true,'right');w3.getCell(r3,1).value='الإجمالي الكلي';
  const t3=w3.getCell(r3,2);t3.value={formula:`SUM(B7:B${r3-1})`,result:grand};paint(t3,NAVY,WH,true);t3.numFmt=MN;
  try{

    await saveFile(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(e){note('تعذّر تجهيز الملف.',true)}
};
async function saveFile(name,blob){
  let dl=null;try{if(typeof claude!=='undefined')dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:await blob.arrayBuffer()});note('تم تجهيز الملف: '+name);return}catch(e){if(e&&e.code==='declined')return}}
  const f=new File([blob],name,{type:blob.type});
  if(/Android|iPhone|iPad/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();
  $('msg').style.color='var(--ok)';$('msg').innerHTML='لو لم يبدأ التحميل: <a href="'+u+'" download="'+esc(name)+'" target="_blank" style="color:var(--ac)">اضغط هنا لتحميل '+esc(name)+'</a>';
}
function reportEl(){
  const logo=S.logo||makeLogo();
  let h=`<style>#rep{width:900px;padding:24px;background:#fff;color:#1d2330;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl}#rep .b{margin-bottom:14px}#rep table{width:100%;border-collapse:collapse;font-size:13px}#rep th{background:#e06a10;color:#fff;padding:7px 5px;border:1px solid #dde2ea}#rep td{padding:6px 5px;border:1px solid #dde2ea;text-align:center}#rep td.t{text-align:right}#rep .fl{background:#14213d;color:#fff;padding:10px 14px;font-weight:700;font-size:16px}#rep .sc{background:#f5f7fa;color:#b8540a;padding:7px 14px;font-weight:700}#rep .st td{background:#f5f7fa;font-weight:700}#rep .ft{background:#f5f7fa;padding:9px 14px;font-weight:700;display:flex;justify-content:space-between}#rep .gt{background:#14213d;color:#fff;padding:12px 14px;font-weight:700;font-size:17px;display:flex;justify-content:space-between}#rep .dd td{color:#c0392b}</style>`;
  h+=`<div class="b" style="display:flex;align-items:center;gap:18px"><img src="${logo}" style="height:70px"><div><div style="font-size:24px;font-weight:700">حصر بنود التشطيبات</div><div style="color:#6b7280">المشروع: ${esc(S.name||'—')} &nbsp; التاريخ: ${new Date().toLocaleDateString('ar-EG')}</div></div></div>`;
  const th=['م','البند','الوحدة','الطول','العرض','الارتفاع','المساحة','العدد','الكمية','السعر','الإجمالي'].map(t=>`<th>${t}</th>`).join('');
  let grand=0;
  [...new Set(S.items.map(i=>i.floor||'بدون دور'))].forEach(fl=>{
    h+=`<div class="b fl">الدور: ${esc(fl)}</div>`;let ft=0;
    const inF=S.items.filter(i=>(i.floor||'بدون دور')===fl);
    [...new Set(inF.map(i=>i.section||'بدون قسم'))].forEach(sc=>{
      let st=0;
      const rows=inF.filter(i=>(i.section||'بدون قسم')===sc).map((it,k)=>{const q=calc(it),p=parseFloat(it.price)||0;st+=q*p;return `<tr class="${it.ded?'dd':''}"><td>${k+1}</td><td class="t">${esc(it.name)}${it.ded?' (خصم)':''}${dedOf(it)?' (بعد خصم '+f2(dedOf(it))+' م²)':''}</td><td>${esc(it.unit)}</td><td>${it.l?esc(it.l)+' م':''}</td><td>${it.w?esc(it.w)+' م':''}</td><td>${it.h?esc(it.h)+' م':''}</td><td>${areaOf(it)?f2(areaOf(it))+' م²':''}</td><td>${esc(it.n)}</td><td><b>${f2(q)} ${esc(it.unit)}</b></td><td>${p?f2(p)+' جنيه':''}</td><td>${f2(q*p)} جنيه</td></tr>`}).join('');
      ft+=st;
      h+=`<div class="b"><div class="sc">القسم: ${esc(sc)}</div><table><thead><tr>${th}</tr></thead><tbody>${rows}<tr class="st"><td colspan="10" style="text-align:left">إجمالي القسم</td><td>${f2(st)} جنيه</td></tr></tbody></table></div>`});
    h+=`<div class="b ft"><span>إجمالي ${esc(fl)}</span><span>${f2(ft)} جنيه</span></div>`;grand+=ft});
  h+=`<div class="b gt"><span>الإجمالي الكلي للمشروع</span><span>${f2(grand)} جنيه</span></div>`;
  const d=document.createElement('div');d.id='rep';d.style.cssText='position:fixed;left:-10000px;top:0';d.innerHTML=h;document.body.appendChild(d);return d}
async function exportImg(kind){
  if(!S.items.length){note('أضف بنودًا أولًا قبل التصدير.',true);return}
  if(typeof html2canvas==='undefined'||(kind==='pdf'&&!window.jspdf)){note('تعذّر تحميل مكتبة التصدير.',true);return}
  note('جارٍ تجهيز الملف...');
  const d=reportEl();
  try{
    await (document.fonts&&document.fonts.ready);
    const sc=Math.min(2,14000/d.offsetHeight);
    const cv=await html2canvas(d,{scale:sc,backgroundColor:'#ffffff',useCORS:true});
    const base=(S.name||'حصر-التشطيبات').replace(/[\\/:*?"<>|]/g,'-');
    if(kind==='jpg'){const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));await saveFile(base+'.jpg',bl);return}
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),pw=210,pxPage=cv.width*297/pw;
    const cuts=[...d.children].map(c=>(c.offsetTop+c.offsetHeight)*sc);
    let y=0,first=true;
    while(y<cv.height-1){
      let end=Math.min(y+pxPage,cv.height);
      if(end<cv.height){const ok=cuts.filter(c=>c>y+pxPage*.3&&c<=end);if(ok.length)end=Math.max(...ok)}
      const pg=document.createElement('canvas');pg.width=cv.width;pg.height=Math.round(end-y);pg.getContext('2d').drawImage(cv,0,y,cv.width,end-y,0,0,cv.width,end-y);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pg.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,(end-y)*pw/cv.width);y=end}
    await saveFile(base+'.pdf',pdf.output('blob'));
  }catch(e){note('تعذّر تجهيز الملف.',true)}finally{d.remove()}
}
$('pdf').onclick=()=>exportImg('pdf');$('jpg').onclick=()=>exportImg('jpg');
